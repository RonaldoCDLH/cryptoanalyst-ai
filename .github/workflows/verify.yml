name: Validación CryptoAnalyst AI Pro
on:
  push:
    branches: [main, feature/registro-redisenio-pro]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verificar sintaxis de todos los módulos
        run: python -m compileall -q app.py auth365.py agent365.py data.py services tests
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt
      - name: Probar registro y bloqueo de contenido
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Verificar importación de agente y herramientas
        run: |
          python -c "from agent365 import crypto_list_tool, crypto_data_tool, crypto_news_tool, graph, configured; print('Agent imported; 3 tools defined')"
